<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Elite Journey</title>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Elite Journey"/>
<meta name="theme-color" content="#000000"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text y='.9em' font-size='80' x='10'>⚡</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="manifest" href="/Elite-journey-/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--surface:#0d0d0d;--surface2:#161616;--border:#1f1f1f;
  --green:#00e676;--gold:#ffd600;--red:#ff1744;--text:#f0f0f0;--muted:#444;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
body{display:flex;flex-direction:column;padding-top:var(--st);}

/* HEADER */
.hdr{padding:18px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);}
.logo{font-family:'Cinzel',serif;font-size:26px;font-weight:900;letter-spacing:2px;color:#fff;display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.logo span{color:var(--gold);}
.streak-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:6px 16px;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:1px;}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);}
.tab{flex:1;padding:12px 0;background:transparent;border:none;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:2px;cursor:pointer;border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif;transition:color .2s;}
.tab.active{color:#fff;border-bottom:2px solid var(--green);}

/* SCROLL AREA */
.content{flex:1;overflow-y:auto;padding:16px 16px calc(var(--sb) + 20px);-webkit-overflow-scrolling:touch;}

/* PROGRESS CARD */
.prog-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:16px;display:flex;align-items:center;gap:16px;}
.ring-wrap{position:relative;flex-shrink:0;width:90px;height:90px;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:20px;font-weight:700;}
.prog-info h3{font-family:'Cinzel',serif;font-size:15px;letter-spacing:1px;margin-bottom:4px;}
.prog-info p{font-size:12px;color:var(--muted);}
.prog-bar{height:4px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:10px;}
.prog-fill{height:100%;border-radius:4px;transition:width .5s ease,background .5s ease;}

/* SECTION LABEL */
.lbl{font-size:10px;font-weight:700;letter-spacing:3px;color:var(--muted);margin-bottom:10px;margin-top:4px;}

/* TASKS */
.task-list{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
.task-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;cursor:pointer;border:none;width:100%;text-align:left;transition:background .15s;color:var(--text);}
.task-row.done{background:#0a1f14;border:1px solid #0f3020;}
.task-row:active{transform:scale(0.98);}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;background:transparent;}
.task-row.done .chk{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(0,230,118,.4);}
.chk-icon{font-size:13px;color:#000;font-weight:900;display:none;}
.task-row.done .chk-icon{display:block;}
.task-emoji{font-size:18px;flex-shrink:0;}
.task-name{font-size:14px;font-weight:500;flex:1;}
.task-row.done .task-name{color:var(--muted);text-decoration:line-through;}

/* SAVE BTN */
.save-btn{width:100%;padding:17px;background:linear-gradient(135deg,var(--green),#00b248);border:none;border-radius:16px;color:#000;font-family:'Cinzel',serif;font-size:18px;letter-spacing:2px;cursor:pointer;box-shadow:0 0 30px rgba(0,230,118,.2);transition:transform .15s,opacity .15s;margin-top:4px;}
.save-btn:active{transform:scale(0.97);opacity:.85;}

/* HISTORY */
.hist-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:8px;}
.hist-date{font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500;}
.hist-bar-bg{height:4px;background:var(--border);border-radius:4px;overflow:hidden;width:180px;}
.hist-bar-fill{height:100%;border-radius:4px;}
.hist-pct{font-family:'Cinzel',serif;font-size:18px;font-weight:700;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center;}
.stat-num{font-family:'Cinzel',serif;font-size:28px;font-weight:900;color:var(--green);}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:1px;}

/* HABITS TAB */
.add-row{display:flex;gap:8px;margin-bottom:16px;}
.emoji-btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:20px;cursor:pointer;flex-shrink:0;}
.habit-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:#fff;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;}
.add-btn{background:var(--green);border:none;border-radius:12px;padding:12px 18px;color:#000;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0;}
.habit-item{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:7px;}
.habit-item-name{font-size:14px;}
.del-btn{background:transparent;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 4px;}
.reset-btn{width:100%;padding:14px;background:transparent;border:1px solid var(--border);border-radius:14px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;margin-top:8px;font-family:'DM Sans',sans-serif;}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--sb) + 20px);left:50%;transform:translateX(-50%) translateY(100px);background:var(--green);color:#000;font-weight:700;font-size:13px;padding:12px 24px;border-radius:100px;z-index:999;transition:transform .4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}

.empty{color:var(--muted);font-size:13px;padding:16px 0;font-style:italic;}
.panel{display:none;}.panel.active{display:block;}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">ELITE <span>⚡</span> JOURNEY</div>
  <div class="streak-pill">🔥 <span id="streakVal">0</span> DAY STREAK</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('today',this)">TODAY</button>
  <button class="tab" onclick="switchTab('history',this)">HISTORY</button>
  <button class="tab" onclick="switchTab('stats',this)">STATS</button>
  <button class="tab" onclick="switchTab('habits',this)">HABITS</button>
</div>

<div class="content">
  <!-- TODAY -->
  <div id="panel-today" class="panel active">
    <div class="prog-card">
      <div class="ring-wrap">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle cx="45" cy="45" r="38" fill="none" stroke="#1a1a1a" stroke-width="9"/>
          <circle id="ringCircle" cx="45" cy="45" r="38" fill="none" stroke="#00e676" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="238.76" stroke-dashoffset="238.76"
            style="transition:stroke-dashoffset .5s ease,stroke .5s ease;filter:drop-shadow(0 0 8px #00e676)"/>
        </svg>
        <div class="ring-label" id="ringLabel">0%</div>
      </div>
      <div class="prog-info">
        <h3 id="motivTitle">START YOUR DAY</h3>
        <p id="motivSub">Complete habits to level up</p>
        <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      </div>
    </div>
    <div class="lbl">HABITS</div>
    <div class="task-list" id="taskList"></div>
    <button class="save-btn" onclick="saveDay()">SAVE DAY 🚀</button>
  </div>

  <!-- HISTORY -->
  <div id="panel-history" class="panel">
    <div class="lbl">PAST DAYS</div>
    <div id="histList"></div>
  </div>

  <!-- STATS -->
  <div id="panel-stats" class="panel">
    <div class="lbl">OVERVIEW</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">DAYS LOGGED</div></div>
      <div class="stat-card"><div class="stat-num" id="statStreak">0</div><div class="stat-lbl">BEST STREAK</div></div>
      <div class="stat-card"><div class="stat-num" id="statAvg">0%</div><div class="stat-lbl">AVG SCORE</div></div>
      <div class="stat-card"><div class="stat-num" id="statPerfect">0</div><div class="stat-lbl">PERFECT DAYS</div></div>
    </div>
  </div>

  <!-- HABITS -->
  <div id="panel-habits" class="panel">
    <div class="lbl">ADD HABIT</div>
    <div class="add-row">
      <button class="emoji-btn" id="emojiBtn" onclick="cycleEmoji()">✨</button>
      <input class="habit-input" id="habitInput" placeholder="Habit name..." maxlength="30"/>
      <button class="add-btn" onclick="addHabit()">ADD</button>
    </div>
    <div class="lbl">YOUR HABITS (<span id="habitCount">0</span>)</div>
    <div id="habitList"></div>
    <button class="reset-btn" onclick="resetDefaults()">RESET TO DEFAULTS</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULTS = [
  {e:"💧",n:"4L Water"},{e:"🏋️",n:"Workout"},{e:"🚶",n:"Walking 1.5hr"},
  {e:"📚",n:"Study 1hr"},{e:"🤖",n:"AI Learning 1hr"},{e:"💸",n:"Money Learning 30min"},
  {e:"🗣️",n:"English Speaking 30min"},{e:"🚀",n:"Skill Learning 30min"},
  {e:"📱",n:"Screen Time < 2hr"},{e:"🍽️",n:"Under 1400 Calories"},{e:"🚫",n:"No Junk Food"}
];
const EMOJIS=["✨","💪","🔥","⚡","🎯","📖","🏃","💡","🌟","❤️","🧠","💰","🎵","🥗","💤"];
let emojiIdx=0;

function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

let habits = load("ej-habits", DEFAULTS);
let tasks  = habits.map(h=>({...h,done:false}));
let history= load("ej-history",[]);
let streak = load("ej-streak",0);
let bestStreak=load("ej-best",0);

function pct(){
  if(!tasks.length)return 0;
  return Math.round(tasks.filter(t=>t.done).length/tasks.length*100);
}

function renderToday(){
  const p=pct(), done=tasks.filter(t=>t.done).length, total=tasks.length;
  const circ=238.76, offset=circ-(p/100)*circ;
  const color=p>=80?"#00e676":p>=50?"#ffd600":"#ff1744";
  document.getElementById("ringCircle").style.strokeDashoffset=offset;
  document.getElementById("ringCircle").style.stroke=color;
  document.getElementById("ringCircle").style.filter=`drop-shadow(0 0 8px ${color})`;
  document.getElementById("ringLabel").textContent=p+"%";
  document.getElementById("progFill").style.width=p+"%";
  document.getElementById("progFill").style.background=color;
  const titles=p===100?["PERFECT DAY ✦","Every habit crushed!"]:p>=80?["ALMOST THERE 💪","Final push — you got this!"]:p>=50?["HALFWAY ⚡","Past the midpoint, keep going!"]:p>0?["KEEP GOING 🔥","Every habit counts!"]:["START YOUR DAY","Complete habits to level up"];
  document.getElementById("motivTitle").textContent=titles[0];
  document.getElementById("motivSub").textContent=titles[1];
  const list=document.getElementById("taskList");
  list.innerHTML=tasks.map((t,i)=>`
    <button class="task-row${t.done?' done':''}" onclick="toggle(${i})">
      <div class="chk"><span class="chk-icon">✓</span></div>
      <span class="task-emoji">${t.e}</span>
      <span class="task-name">${t.n}</span>
    </button>`).join('');
  document.getElementById("streakVal").textContent=streak;
}

function renderHistory(){
  const el=document.getElementById("histList");
  if(!history.length){el.innerHTML='<p class="empty">No records yet — save your first day!</p>';return;}
  el.innerHTML=history.map(h=>{
    const c=h.pct>=80?"#00e676":h.pct>=50?"#ffd600":"#ff1744";
    return`<div class="hist-row">
      <div><div class="hist-date">${h.date}</div>
      <div class="hist-bar-bg"><div class="hist-bar-fill" style="width:${h.pct}%;background:${c}"></div></div></div>
      <div class="hist-pct" style="color:${c}">${h.pct}%</div>
    </div>`;
  }).join('');
}

function renderStats(){
  const total=history.length;
  const avg=total?Math.round(history.reduce((a,h)=>a+h.pct,0)/total):0;
  const perfect=history.filter(h=>h.pct===100).length;
  document.getElementById("statTotal").textContent=total;
  document.getElementById("statStreak").textContent=bestStreak;
  document.getElementById("statAvg").textContent=avg+"%";
  document.getElementById("statPerfect").textContent=perfect;
}

function renderHabits(){
  document.getElementById("habitCount").textContent=habits.length;
  const el=document.getElementById("habitList");
  if(!habits.length){el.innerHTML='<p class="empty">No habits yet. Add one above!</p>';return;}
  el.innerHTML=habits.map((h,i)=>`
    <div class="habit-item">
      <span class="habit-item-name">${h.e} ${h.n}</span>
      <button class="del-btn" onclick="deleteHabit(${i})">✕</button>
    </div>`).join('');
}

function toggle(i){tasks[i].done=!tasks[i].done;renderToday();}

function saveDay(){
  const p=pct();
  const entry={date:new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}),pct:p};
  history=[entry,...history].slice(0,60);
  save("ej-history",history);
  streak=p>=80?streak+1:0;
  if(streak>bestStreak){bestStreak=streak;save("ej-best",bestStreak);}
  save("ej-streak",streak);
  tasks=habits.map(h=>({...h,done:false}));
  renderToday();renderHistory();renderStats();
  showToast(p>=80?`🔥 Streak: ${streak} days!`:"✅ Day saved. Aim for 80%+!");
}

function addHabit(){
  const inp=document.getElementById("habitInput");
  const n=inp.value.trim();
  if(!n)return;
  const e=document.getElementById("emojiBtn").textContent;
  habits.push({e,n});
  save("ej-habits",habits);
  tasks=habits.map(h=>({...h,done:false}));
  inp.value="";
  renderHabits();renderToday();
  showToast("Habit added! 💪");
}

function deleteHabit(i){
  habits.splice(i,1);
  save("ej-habits",habits);
  tasks=habits.map(h=>({...h,done:false}));
  renderHabits();renderToday();
}

function resetDefaults(){
  habits=[...DEFAULTS];
  save("ej-habits",habits);
  tasks=habits.map(h=>({...h,done:false}));
  renderHabits();renderToday();
  showToast("Reset to defaults! ✅");
}

function cycleEmoji(){
  emojiIdx=(emojiIdx+1)%EMOJIS.length;
  document.getElementById("emojiBtn").textContent=EMOJIS[emojiIdx];
}

function switchTab(name,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='history')renderHistory();
  if(name==='stats')renderStats();
  if(name==='habits')renderHabits();
}

let toastT;
function showToast(msg){
  clearTimeout(toastT);
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  toastT=setTimeout(()=>t.classList.remove("show"),3000);
}

renderToday();
</script>
</body>
</html>
